# collection to execute before each test run
name: "initialization"
headers:
  # Ask the oracle to trace each request (portal/oracle/sampler.go). It has
  # an effect only with tracing on (make up TRACING=1); otherwise the oracle
  # has no OTLP endpoint and records nothing. Martin collections cannot add
  # a header in a script, so each collection lists it.
  - key: x-profile-request
    value: "1"
  - key: Content-Type
    value: application/json
tests:
  - name: "INIT: Health check"
    method: GET
    path: "v1/sandbox/health_check"
    test_script: |
      pm.test("ok", () => {
          console.log(pm.response.text());
          let data = pm.response.json();
          console.log(data);
          pm.response.to.have.status(200);
          pm.expect(data).to.not.have.property("exception");
      });
  - name: "INIT: swagger.json"
    method: GET
    path: "swagger.json"
    test_script: |
      pm.test("ok", () => {
          console.log(pm.response.text());
          let data = pm.response.json();
          console.log(data);
          pm.response.to.have.status(200);
          pm.expect(data).to.not.have.property("exception");
      });
