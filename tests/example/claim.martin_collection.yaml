name: "Sandbox Example: Claim Management"
headers:
  - key: Content-Type
    value: application/json
tests:
  - name: "Create claim"
    method: POST
    path: "v1/sandbox/claims"
    body: |
      {
        "date_of_accident": "2024-01-15",
        "damage_amount": 500000,
        "claim_reason": "Car accident due to adverse weather conditions."
      }
    test_script: |
      pm.test("ok", () => {
          let data = pm.response.json();
          console.log(data);
          pm.response.to.have.status(200);
          pm.expect(data).to.not.have.property("exception");
          pm.expect(data).to.have.property("claim");
          pm.expect(data.claim).to.have.property("claim_id");
          // A new claim waits for its claimant. gen is the claim's wait
          // generation: Add claimant must send it back.
          pm.expect(data.claim.state).to.eql("CLAIM_STATE_WAITING");
          pm.expect(data.claim.step).to.eql("claimant");
          pm.environment.set("CLAIM_ID", data.claim.claim_id);
          pm.environment.set("CLAIM_GEN", data.claim.gen);
      });
  - name: "Get claim"
    method: GET
    path: "v1/sandbox/claim/{{CLAIM_ID}}"
    test_script: |
      pm.test("ok", () => {
          let data = pm.response.json();
          console.log(data);
          pm.response.to.have.status(200);
          pm.expect(data).to.not.have.property("exception");
          pm.expect(data).to.have.property("claim");
          pm.expect(data.claim.state).to.eql("CLAIM_STATE_WAITING");
          pm.expect(data.claim.step).to.eql("claimant");
          pm.expect(data.claim.claim_reason).to.eql("Car accident due to adverse weather conditions.");
      });
  - name: "Add claimant"
    method: POST
    path: "v1/sandbox/claim/{{CLAIM_ID}}/claimant"
    body: |
      {
        "claim_id": "{{CLAIM_ID}}",
        "gen": "{{CLAIM_GEN}}",
        "claimant": {
          "account_number": "",
          "account_sort_code": "",
          "dob": "1945-11-01",
          "surname": "Smith",
          "forename": "Raymond",
          "full_address": "3 High Street",
          "address_number": "3",
          "address_street1": "High Street",
          "address_postcode": "BA13 3BN",
          "address_post_town": "Westbury",
          "nationality": "NATIONALITY_GB"
        }
      }
    test_script: |
      pm.test("ok", () => {
          let data = pm.response.json();
          console.log(data);
          pm.response.to.have.status(200);
          pm.expect(data).to.not.have.property("exception");
          pm.expect(data).to.have.property("claim");
          // The claim has left the claimant step. Where it is now depends on
          // how fast the Connector Hub answers, so the test does not name
          // the step.
          pm.expect(data.claim.step).to.not.eql("claimant");
          pm.expect(data.claim.claimant.forename).to.eql("Raymond");
      });
