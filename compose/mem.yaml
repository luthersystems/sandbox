# Configuration for an "in-memory" mode fabric network.
services:
  sandbox_oracle:
    user: "${DOCKER_UID}:${DOCKER_GID}"
    extends:
      file: common.yaml
      service: sandbox_oracle
    ports:
    - "8080:8080" # expose this for testing purposes
    - "9600:9600" # expose this for testing purposes
    environment:
    - SANDBOX_ORACLE_EMULATE_CC=true
    - TMPDIR=/tmp
    - SUBSTRATEHCP_FILE=/tmp/plugin
    # Forward to the in-process substratehcp plugin so its tracer is non-noop
    # (required for the per-request Debug->Info log promotion to fire).
    - SUBSTRATE_OTLP_ENDPOINT
    - SUBSTRATE_LOG_LEVEL
    # OTel resource.WithProcess() calls os/user.Current() which fails inside
    # the container (no passwd entry for DOCKER_UID); set USER to short-circuit.
    - USER=oracle
    volumes:
    - ../${SUBSTRATE_PLUGIN_LINUX}:/tmp/plugin
    networks:
    - byfn
networks:
  byfn:
    name: byfn
