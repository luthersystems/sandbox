# Configuration for an "in-memory" mode fabric network.
services:
  sandbox_oracle:
    user: "${DOCKER_UID}:${DOCKER_GID}"
    extends:
      file: common.yaml
      service: sandbox_oracle
    # Ports bind to 127.0.0.1 only. The local network has no real
    # authentication, so it must not be reachable from other machines on
    # your network. Containers on byfn (Martin, for example) reach the
    # oracle by name, not through these ports.
    ports:
    - "127.0.0.1:8080:8080" # the oracle API, for tests and curl on this machine only
    - "127.0.0.1:9600:9600" # the oracle metrics, on this machine only
    environment:
    - SANDBOX_ORACLE_EMULATE_CC=true
    - TMPDIR=/tmp
    - SUBSTRATEHCP_FILE=/tmp/plugin
    # Forward to the in-process substratehcp plugin so its tracer is non-noop
    # (required for the per-request Debug->Info log promotion to fire).
    - SUBSTRATE_OTLP_ENDPOINT
    - SUBSTRATE_LOG_LEVEL
    volumes:
    - ../${SUBSTRATE_PLUGIN_LINUX}:/tmp/plugin
    networks:
    - byfn
networks:
  byfn:
    name: byfn
