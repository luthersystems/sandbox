name: govulncheck

# Known-vulnerability gate: govulncheck is call-graph-aware, so it only fails
# on vulnerabilities whose vulnerable code this module actually reaches —
# low-noise by design. Uses the latest stable Go toolchain so the stdlib is
# scanned at a current patch level.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install govulncheck
        run: bash scripts/govulncheck-install.sh
      # Same script as the scheduled run, so the PR gate gets the same
      # GOMEMLIMIT sizing and the same finding-vs-scan-failure split: exit 3
      # is a finding, any other non-zero (a load error, or a scan killed for
      # memory) is reported as a SCAN FAILURE, and both fail the check.
      - name: Run govulncheck
        id: scan
        run: bash scripts/govulncheck-scan.sh
      - name: Fail if govulncheck reported a finding or did not complete
        if: ${{ !cancelled() && steps.scan.outputs.exit != '0' }}
        env:
          SOURCE_SCAN_FAILED: ${{ steps.scan.outputs.scan_failed }}
          SOURCE_VULNS_FOUND: ${{ steps.scan.outputs.vulns_found }}
          SOURCE_SCAN_EXIT: ${{ steps.scan.outputs.exit }}
        run: bash scripts/govulncheck-fail-summary.sh
