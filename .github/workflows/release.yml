# Publishes the oracle image to Docker Hub as luthersystems/oracle:<tag>.
#
# Do not remove this workflow. Luther Enterprise deploys sandbox by default
# when it brings up an environment: ui-core sets oracle_image_repo to
# luthersystems/oracle and app_version to a sandbox tag
# (jobs/workflows/ansible_args.go), and sandbox-infrastructure-template deploys
# that image (ansible/vars/umbrella.yaml). To ship a new sandbox to Enterprise,
# dispatch release-tag.yml on main (it creates the tag that runs this
# workflow), then bump defaultAppVersion in ui-core to that tag.
name: Build, Push, and Release
on:
  push:
    tags:
      - "*"
jobs:
  # release-tag.yml checks the commit before it creates a tag, but anyone with
  # push access can still push a tag by hand. Refuse a tag whose commit is not
  # on main, so a hand-pushed tag cannot publish an image from an unreviewed
  # branch. Same guard as luthersystems/mars's mars-release.yml.
  require-main:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require release tag to be on main
        run: |
          set -eu
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "::error::Release tag must point to a commit on main"
            exit 1
          }
  build-push-docker:
    needs:
      - require-main
    name: ${{ matrix.arch }} - docker build
    runs-on: ${{ fromJSON('{"arm64":"2vcpu-ubuntu-2204-arm","amd64":"ubuntu-22.04"}')[matrix.arch] }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: read # This is required for actions/checkout
    strategy:
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Install Docker (ARM runners)
        if: runner.arch == 'ARM64'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg make
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin
          sudo chmod 666 /var/run/docker.sock
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0 # include tags for VERSION detection
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Log in last, right before the docker work: the OIDC token expires.
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Publish Docker
        run: make publish VERSION=$GITHUB_REF_NAME TAG_SUFFIX=-${{ matrix.arch }}
        timeout-minutes: 60 # the Docker Hub OIDC token lasts 60 minutes
  push-docker-manifests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Docker Hub OIDC login
    needs:
      - build-push-docker
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      # Log in last, right before the docker work: the OIDC token expires.
      - name: Configure DockerHub
        uses: ./.github/actions/configure-dockerhub
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Publish
        run: make publish-docker-manifests VERSION=$GITHUB_REF_NAME
        timeout-minutes: 60
