name: CI Tests
on:
  pull_request:
    branches:
      - main
  # Also test main as merged; the pull_request runs only test each PR branch.
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint runs in the shared Quality workflow
      # (.github/workflows/quality.yml), with one version for every repo.
      - name: Run CI tests
        run: script -q -e -c "make citest"
      # Check the oracle image with the build-harden kit
      # (luthersystems/buildenv#163). The shared action holds the one copy of
      # the check, so a fix reaches this repo when v1 moves. make harden-env
      # gives the kit pin (common.config.mk) and the image ref.
      - name: Build the oracle image
        id: oracle
        run: |
          make portal-image
          make -s --no-print-directory -C portal harden-env >> "$GITHUB_OUTPUT"
      - name: Check the oracle image with build-harden
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          kit: ${{ steps.oracle.outputs.kit }}
          images: ${{ steps.oracle.outputs.image }}

  # Start and stop the local Fabric network (fabric/Makefile fnb-smoke) with
  # the builder as the runner's user, not root, as `make up` does. The
  # runner image has Docker.
  fabric-network:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start and stop the local Fabric network
        run: make -C fabric fnb-smoke

  # Run the e2e tests with the tracing stack (make up TRACING=1) and check
  # that the oracle, gateway and chaincode each sent spans, to the span file
  # and to Tempo (scripts/check-traces.sh). Tracing can break without any
  # test failing, so this job is what notices. The build job runs the same
  # tests without tracing, as a network without a collector runs.
  tracing:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start the network with tracing
        run: script -q -e -c "make up TRACING=1"
      - name: Run the e2e tests
        run: script -q -e -c "make integration"
      - name: Check the traces
        run: scripts/check-traces.sh
      - name: Show the tracing stack logs
        if: failure()
        run: docker logs otelcol; docker logs tempo
      - name: Stop the network
        if: always()
        run: make down
