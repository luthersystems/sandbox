name: CI Tests
on:
  # No paths filter: the gate job below is a required check, so every PR must
  # start a run. The changes job skips the heavy jobs on docs-only PRs.
  pull_request:
    branches:
      - main
  # The merge queue is on for main: the queue waits for every required check
  # on the merged result, so this workflow must run there too.
  merge_group:
  # Also test main as merged; the pull_request runs only test each PR branch.
  # release-tag.yml checks this push run before it tags a commit.
  push:
    branches:
      - main
jobs:
  # Decides whether the build and test jobs must run (scripts/ci-changes.sh).
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # On a pull request this checks out the merge commit. Its first parent
      # is the base branch tip, so depth 2 is enough for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test the decision script and the gate's needs list
        run: bash scripts/ci-changes-test.sh
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            bash scripts/ci-changes.sh HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # golangci-lint runs in the shared Quality workflow
      # (.github/workflows/quality.yml), with one version for every repo.
      - name: Run CI tests
        run: script -q -e -c "make citest"
      # Check the oracle image with the build-harden kit
      # (luthersystems/buildenv#163). The shared action holds the one copy of
      # the check, so a fix reaches this repo when v1 moves. make harden-env
      # gives the kit pin (common.config.mk) and the image ref.
      - name: Build the oracle image
        id: oracle
        run: |
          make portal-image
          make -s --no-print-directory -C portal harden-env >> "$GITHUB_OUTPUT"
      - name: Check the oracle image with build-harden
        uses: luthersystems/.github/actions/harden-check@v1
        with:
          kit: ${{ steps.oracle.outputs.kit }}
          images: ${{ steps.oracle.outputs.image }}

  # Start and stop the local Fabric network (fabric/Makefile fnb-smoke) with
  # the builder as the runner's user, not root, as `make up` does. The
  # runner image has Docker.
  fabric-network:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start and stop the local Fabric network
        run: make -C fabric fnb-smoke

  # Run the e2e tests with the tracing stack (make up TRACING=1) and check
  # that the oracle, gateway and chaincode each sent spans, to the span file
  # and to Tempo (scripts/check-traces.sh). Tracing can break without any
  # test failing, so this job is what notices. The build job runs the same
  # tests without tracing, as a network without a collector runs.
  tracing:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start the network with tracing
        run: script -q -e -c "make up TRACING=1"
      - name: Run the e2e tests
        run: script -q -e -c "make integration"
      - name: Check the traces
        run: scripts/check-traces.sh
      - name: Show the tracing stack logs
        if: failure()
        run: docker logs otelcol; docker logs tempo
      - name: Stop the network
        if: always()
        run: make down

  # Fails a PR that would land an invalid workflow file. GitHub itself does
  # not: it rejects the file only when the workflow is triggered, so a broken
  # scheduled workflow goes silent instead of red. See scripts/lint-workflows.sh
  # for the triggering example. It was its own workflow, filtered to workflow
  # paths, but a filtered workflow reports no check on the merge queue or on
  # most PRs, so the gate could not require it. It takes about a minute.
  actionlint:
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false
      - name: Lint workflows
        run: bash scripts/lint-workflows.sh

  # The one check the main ruleset requires from this workflow.
  ci-all:
    name: CI (all required checks)
    # always(), so the gate reports on every run. A cancelled or failed job
    # then fails the gate below. A gate that did not run, or was skipped,
    # could count as passing for the required check.
    if: always()
    needs: [changes, build, fabric-network, tracing, actionlint]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # Pass only if the changes job succeeded and every other job succeeded,
      # or was skipped because the changes job said the PR is docs-only
      # (code=false). Any other skip fails, so a job skipped by mistake
      # cannot pass the gate.
      - name: Fail unless every required job passed
        if: >-
          needs.changes.result != 'success'
          || contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || (needs.changes.outputs.code != 'false' && contains(needs.*.result, 'skipped'))
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          echo "::error::A required CI job failed, was cancelled or was skipped."
          exit 1
      - name: Every required job passed or was skipped as docs-only
        run: echo "ok"
