msp-id: Org1MSP
user-id: User1
org-domain: org1.luther.systems
crypto-config-root-path: ./crypto-config
peer-name: peer0
peer-endpoint: "peer0.org1.luther.systems:7051"
channel-name: luther
chaincode-id: sandbox
# The scheduler expires the claim flow's connector deadlines
# (:connector-timeout in phylum/claim.lisp). Without it a request whose reply
# never comes leaves the claim waiting for ever. The hub signs as Org1MSP,
# which the flow lists in :admin-from, and the interval is well under the
# flow's shortest deadline (1h).
scheduler:
  interval: 30s
connectors:
  - name: EMAIL
    mock: true
    email:
      smtp_server: localhost
      from_address: martin@luther.systems

  - name: CAMUNDA_WORKFLOW
    mock: true
    camunda-start:
      gateway-url: localhost

  - name: CAMUNDA_TASKLIST
    mock: true
    camunda-inspect:
      operate-url: localhost

  - name: EQUIFAX_ID_VERIFY
    mock: true
    equifax:
      host: localhost
      # connectorhub v0.0.28+ requires these, even for a mock.
      client_id: mock-client-id
      client_secret: mock-client-secret

  - name: INVOICE_NINJA
    mock: true
    invoice-ninja: {}

  - name: POSTGRES_CLAIMS_DB
    mock: true
    postgres:
      host: localhost
      port: 5432
      database: claims_db
      username: testuser
      password: testpass
      ssl_settings: POSTGRES_SSL_MODE_DISABLE

  - name: STRIPE_PAYMENT
    mock: true
    stripe:
      # connectorhub v0.0.28+ requires it, even for a mock.
      secret: mock-secret
